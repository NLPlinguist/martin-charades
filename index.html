<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charades Clue Generator</title>
<style>
  :root {
    --bg1: #fdf2f8;
    --bg2: #eef4ff;
    --ink: #3a2e4a;
    --card: #ffffff;
    --accent1: #e94f8d;
    --accent2: #7c5cff;
    --soft: #f4e9f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
  }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0;
    text-align: center;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.02em;
  }
  .tagline {
    margin: 8px 0 28px;
    text-align: center;
    color: #7a6b8a;
    font-size: 1.05rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    width: min(720px, 100%);
  }
  .card {
    appearance: none;
    border: none;
    background: var(--card);
    border-radius: 18px;
    padding: 22px 18px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 6px 18px rgba(124, 92, 255, 0.10);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(124, 92, 255, 0.18); }
  .card .emoji { font-size: 2.4rem; display: block; margin-bottom: 10px; }
  .card .name { font-weight: 700; font-size: 1.15rem; }
  .card .count { font-size: 0.85rem; color: #9b8bb0; margin-top: 4px; }

  /* Game screen */
  .game-card {
    width: min(720px, 100%);
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(124, 92, 255, 0.14);
    padding: 40px 32px;
    text-align: center;
  }
  .cat-label {
    display: inline-block;
    background: var(--soft);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #7c5cff;
  }
  .clue {
    margin: 36px 0;
    font-size: clamp(2rem, 7vw, 3.4rem);
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    min-height: 1.2em;
    word-break: break-word;
  }
  .btn-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  #nextBtn {
    appearance: none;
    border: none;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    border-radius: 999px;
    padding: 18px 56px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(233, 79, 141, 0.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #nextBtn:hover { transform: scale(1.03); box-shadow: 0 12px 30px rgba(233, 79, 141, 0.45); }
  #nextBtn:active { transform: scale(0.98); }
  #backBtn {
    appearance: none;
    border: 2px solid #d9c8ee;
    background: #fff;
    color: var(--accent2);
    font-size: 1rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 14px 28px;
    cursor: pointer;
  }
  #backBtn:hover { background: var(--soft); }
  .hint { margin-top: 18px; color: #a091b5; font-size: 0.85rem; }
</style>
</head>
<body>
<main id="app">

  <section id="landing">
    <h1>Charades</h1>
    <p class="tagline">Pick a category, hit NEXT, and start acting.</p>
    <div class="grid">
      <button class="card" data-cat="all">
        <span class="emoji">🎭</span>
        <span class="name">All</span>
        <span class="count" data-count="all"></span>
      </button>
      <button class="card" data-cat="kids">
        <span class="emoji">🎬</span>
        <span class="name">Kids Movies</span>
        <span class="count" data-count="kids"></span>
      </button>
      <button class="card" data-cat="history">
        <span class="emoji">🏛️</span>
        <span class="name">History</span>
        <span class="count" data-count="history"></span>
      </button>
      <button class="card" data-cat="animals">
        <span class="emoji">🦁</span>
        <span class="name">Animals</span>
        <span class="count" data-count="animals"></span>
      </button>
      <button class="card" data-cat="wacky">
        <span class="emoji">🌀</span>
        <span class="name">Wacky Random</span>
        <span class="count" data-count="wacky"></span>
      </button>
      <button class="card" data-cat="family">
        <span class="emoji">👨‍👩‍👧</span>
        <span class="name">Family</span>
        <span class="count" data-count="family"></span>
      </button>
    </div>
  </section>

  <section id="game" hidden>
    <div class="game-card">
      <span class="cat-label" id="catLabel"></span>
      <div class="clue" id="clue">Press NEXT to get a clue</div>
      <div class="btn-row">
        <button id="nextBtn">Next</button>
        <button id="backBtn">Change Category</button>
      </div>
      <p class="hint">Tip: Enter or Space also triggers Next</p>
    </div>
  </section>

</main>

<script>
/* ---------------- Data ---------------- */

const kidsMovies = [
  "Toy Story", "Toy Story 2", "Toy Story 3", "Toy Story 4",
  "Finding Nemo", "Finding Dory", "Zootopia", "Frozen", "Frozen II",
  "Moana", "Moana 2", "Inside Out", "Inside Out 2",
  "Monsters Inc.", "Monsters University", "Brave", "WALL-E", "Up", "Ratatouille",
  "The Incredibles", "Incredibles 2", "Luca", "CARS", "CARS 2",
  "CARS 3", "Cars 4", "Cars: Lightning McQueen", "Coco", "Big Hero 6",
  "Elemental", "Turning Red", "Soul", "Onward", "Ponyo",
  "How to Train Your Dragon", "How to Train Your Dragon 2", "How to Train Your Dragon 3",
  "Shrek", "Shrek 2", "Shrek the Third", "Shrek Forever Ever",
  "Kung Fu Panda", "Kung Fu Panda 2", "Kung Fu Panda 3", "Kung Fu Panda 4",
  "Trolls", "Trolls World Tour", "Trolls: Holiday Beat",
  "Sing", "Sing 2", "The Good Dinosaur",
  "The Lion King (1994)", "The Lion King (2019)", "Wizard of Oz", "King Kong",
  "The Little Mermaid (1989)", "Aladdin (1992)", "The Jungle Book",
  "Beauty and the Beast (1991)", "Mary Poppins", "Mulan (1998)",
  "Home Alone", "Snow White and the Seven Dwarfs", "Cinderella",
  "Alice in Wonderland", "Peter Pan", "Sleeping Beauty",
  "Bambi", "Dumbo", "Pinocchio", "101 Dalmatians",
  "The Aristocats", "Robin Hood", "The Fox and the Hound", "Winnie the Pooh",
  "The Rescuers", "Pete's Dragon", "E.T.", "The Great Mouse Detective",
  "Who Framed Roger Rabbit", "Oliver & Company",
  "Harry Potter and the Sorcerer's Stone", "Harry Potter and the Chamber of Secrets",
  "Harry Potter and the Prisoner of Azkaban", "Harry Potter and the Goblet of Fire",
  "Harry Potter and the Order of the Phoenix", "Harry Potter and the Half-Blood Prince",
  "Harry Potter and the Deathly Hallows",
  "Wreck-It Ralph", "Ralph Breaks the Internet", "Tangled", "Rango",
  "The Iron Giant", "A Bug's Life",
  "Spider-Man: Into the Spider-Verse", "Spider-Man: Across the Spider-Verse",
  "Back to the Future", "The Goonies", "Star Wars", "Gremlins"
];

const historyItems = [
  "Abraham Lincoln", "Joan of Arc", "Julius Caesar", "Cleopatra", "Alexander the Great",
  "Napoleon", "Queen Victoria", "The French Revolution", "The American Revolution", "The Civil War",
  "World War I", "World War II", "The Cold War", "The Titanic", "The Moon Landing",
  "The Space Race", "Apollo 11", "The Berlin Wall", "The Black Plague", "The Guillotine",
  "The Magna Carta", "The Roman Empire", "The Egyptian Pyramids", "The Great Wall", "The Colosseum",
  "Stonehenge", "Pompeii", "The Viking Invasion", "The Crusades", "The Declaration of Independence",
  "The Enigma Code", "The Rosetta Stone", "The Library of Alexandria", "The Suez Canal", "The Panama Canal",
  "The Brooklyn Bridge", "The Golden Gate Bridge", "The Eiffel Tower", "The Model T Ford", "The Transcontinental Railroad",
  "The Industrial Revolution", "The Printing Press", "The Telephone", "The Light Bulb", "The Steam Engine",
  "The Telegraph", "The Radio", "The Television", "The Internet", "The Computer",
  "The Smartphone", "The Airplane", "The Jet Engine", "The Laser", "The Microscope",
  "The Telescope", "Penicillin", "X-Ray", "The Discovery of DNA", "The Morse Code",
  "The Compass", "The Great Fire of London", "September 11th", "The World Trade Center", "The Enigma Machine",
  "D-Day", "The Battle of Gettysburg", "The Trojan Horse", "The Hundred Years War", "The Wild West",
  "The Gold Rush", "The Dust Bowl", "The Great Depression", "The Stock Market Crash", "Women's Suffrage",
  "The Civil Rights Movement", "The Vietnam War", "The Cuban Missile Crisis", "The Boston Tea Party", "The Underground Railroad",
  "The Emancipation Proclamation", "The Gettysburg Address", "The Constitution", "The First Moon Walk", "The Space Shuttle",
  "The International Space Station", "The Sinking of the Lusitania", "The Challenger Disaster", "The Halifax Explosion", "The Pilgrims",
  "The American Frontier", "The Sinking of the Bismarck", "The Battle of Waterloo", "The Fall of Constantinople", "The Siege of Jerusalem",
  "The 1906 San Francisco Earthquake", "The Great Storm", "The Sinking of the Bismarck", "The French Navy", "The American Navy",
  "The Royal Navy", "The Continental Army", "The Union Army", "The Confederate Army", "The British Empire",
  "The Spanish Empire", "The Ottoman Empire", "The Mongol Empire", "The Maya Civilization", "The Inca Empire"
];

const animals = [
  "Lion", "Tiger", "Elephant", "Giraffe", "Zebra",
  "Penguin", "Polar Bear", "Hippopotamus", "Rhinoceros", "Gorilla",
  "Chimpanzee", "Orangutan", "Monkey", "Sloth", "Koala",
  "Kangaroo", "Walrus", "Seal", "Otter", "Whale",
  "Dolphin", "Shark", "Octopus", "Crab", "Starfish",
  "Jellyfish", "Clownfish", "Goldfish", "Sea Turtle", "Lizard",
  "Snake", "Eagle", "Owl", "Parrot", "Flamingo",
  "Peacock", "Crow", "Duck", "Chicken", "Rooster",
  "Horse", "Donkey", "Pig", "Cow", "Sheep",
  "Goat", "Dog", "Cat", "Rabbit", "Squirrel",
  "Fox", "Wolf", "Bear", "Deer", "Bison",
  "Buffalo", "Camel", "Llama", "Alpaca", "Moose",
  "Elk", "Antelope", "Gazelle", "Cheetah", "Jaguar",
  "Leopard", "Panther", "Coyote", "Raccoon", "Beaver",
  "Chipmunk", "Porcupine", "Hedgehog", "Skunk", "Badger",
  "Bobcat", "Lynx", "Wild Boar", "Capybara", "Armadillo",
  "Lemur", "Meerkat", "Hyena", "Crocodile", "Alligator",
  "Iguana", "Gecko", "Chameleon", "Toucan", "Pelican",
  "Swan", "Goose", "Turkey", "Ostrich", "Emu",
  "Hummingbird", "Butterfly"
];

const wackyAdjs = [
  "Sneezing", "Dancing", "Floating", "Haunted", "Glowing", "Wobbly",
  "Cosmic", "Magnetic", "Tiny", "Giant", "Bubbly", "Ninja",
  "Wizard", "Robot", "Rocket", "Moon", "Cloud", "Crystal",
  "Spicy", "Silent", "Bouncy", "Fuzzy", "Electric", "Sparkling"
];
const wackyNouns = [
  "Pickle", "Toaster", "Noodle", "Grandma", "Sandwich",
  "Fish", "Broccoli", "Donut", "Penguin", "Hamster",
  "Cookie", "Cake", "Marshmallow", "Rocket", "Balloon",
  "Pillow", "Toothpaste", "Comet", "Disco", "Taco",
  "Toast", "Whale", "Turtle", "Hopper", "Yoga", "Pizza"
];

const family = ["Mom", "Dad", "Wade", "Joyce", "Mabel", "Barry", "Cash", "Noah"];

/* Build the wacky combos (24 x 26 = 624 options) */
const wacky = [];
for (const a of wackyAdjs) {
  for (const n of wackyNouns) wacky.push(a + " " + n);
}

const categories = {
  all: kidsMovies.concat(historyItems, animals, wacky, family),
  kids: kidsMovies,
  history: historyItems,
  animals: animals,
  wacky: wacky,
  family: family
};

const catNames = {
  all: "All",
  kids: "Kids Movies",
  history: "History",
  animals: "Animals",
  wacky: "Wacky Random",
  family: "Family"
};

/* ---------------- UI ---------------- */
const landing = document.getElementById("landing");
const game = document.getElementById("game");
const catLabel = document.getElementById("catLabel");
const clue = document.getElementById("clue");
const nextBtn = document.getElementById("nextBtn");
const backBtn = document.getElementById("backBtn");

let currentCat = null;
let lastClue = null;

// show counts on cards
for (const key of Object.keys(categories)) {
  const el = document.querySelector('[data-count="' + key + '"]');
  if (el) el.textContent = categories[key].length + " options";
}

function pickClue(cat) {
  const pool = categories[cat];
  let item;
  let guard = 0;
  do {
    item = pool[Math.floor(Math.random() * pool.length)];
    guard++;
  } while (item === lastClue && guard < 20);
  lastClue = item;
  return item;
}

function showGame(cat) {
  currentCat = cat;
  lastClue = null;
  catLabel.textContent = catNames[cat];
  clue.textContent = "Press NEXT to get a clue";
  landing.hidden = true;
  game.hidden = false;
}

function showLanding() {
  game.hidden = true;
  landing.hidden = false;
  currentCat = null;
}

document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => showGame(card.dataset.cat));
});

nextBtn.addEventListener("click", () => {
  if (!currentCat) return;
  clue.textContent = pickClue(currentCat);
});

backBtn.addEventListener("click", showLanding);

window.addEventListener("keydown", (e) => {
  if (game.hidden) return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    nextBtn.click();
  }
  if (e.key === "Escape") showLanding();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charades Clue Generator</title>
<style>
  :root {
    --bg1: #fdf2f8;
    --bg2: #eef4ff;
    --ink: #3a2e4a;
    --card: #ffffff;
    --accent1: #e94f8d;
    --accent2: #7c5cff;
    --soft: #f4e9f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
  }
  main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0;
    text-align: center;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.02em;
  }
  .tagline {
    margin: 8px 0 28px;
    text-align: center;
    color: #7a6b8a;
    font-size: 1.05rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    width: min(720px, 100%);
  }
  .card {
    appearance: none;
    border: none;
    background: var(--card);
    border-radius: 18px;
    padding: 22px 18px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 6px 18px rgba(124, 92, 255, 0.10);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(124, 92, 255, 0.18); }
  .card .emoji { font-size: 2.4rem; display: block; margin-bottom: 10px; }
  .card .name { font-weight: 700; font-size: 1.15rem; }
  .card .count { font-size: 0.85rem; color: #9b8bb0; margin-top: 4px; }

  /* Game screen */
  .game-card {
    width: min(720px, 100%);
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(124, 92, 255, 0.14);
    padding: 40px 32px;
    text-align: center;
  }
  .cat-label {
    display: inline-block;
    background: var(--soft);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #7c5cff;
  }
  .clue {
    margin: 36px 0;
    font-size: clamp(2rem, 7vw, 3.4rem);
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    min-height: 1.2em;
    word-break: break-word;
  }
  .btn-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 24px;
  }
  #nextBtn {
    appearance: none;
    border: none;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    border-radius: 999px;
    padding: 18px 56px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(233, 79, 141, 0.35);
    transition: transform .12s ease, box-shadow .15s ease;
  }
  #nextBtn:hover { transform: scale(1.03); box-shadow: 0 12px 30px rgba(233, 79, 141, 0.45); }
  #nextBtn:active { transform: scale(0.98); }
  #backBtn {
    appearance: none;
    border: 2px solid #d9c8ee;
    background: #fff;
    color: var(--accent2);
    font-size: 1rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 14px 28px;
    cursor: pointer;
  }
  #backBtn:hover { background: var(--soft); }
  .hint { margin-top: 18px; color: #a091b5; font-size: 0.85rem; }
</style>
</head>

<main id="app">

  <section id="landing">
    <h1>Charades</h1>
    <p class="tagline">Pick a category, hit NEXT, and start acting.</p>
    <div class="grid">
      <button class="card" data-cat="all">
        <span class="emoji">🎭</span>
        <span class="name">All</span>
        <span class="count" data-count="all"></span>
      </button>
      <button class="card" data-cat="kids">
        <span class="emoji">🎬</span>
        <span class="name">Kids Movies</span>
        <span class="count" data-count="kids"></span>
      </button>
      <button class="card" data-cat="history">
        <span class="emoji">🏛️</span>
        <span class="name">History</span>
        <span class="count" data-count="history"></span>
      </button>
      <button class="card" data-cat="animals">
        <span class="emoji">🦁</span>
        <span class="name">Animals</span>
        <span class="count" data-count="animals"></span>
      </button>
      <button class="card" data-cat="wacky">
        <span class="emoji">🌀</span>
        <span class="name">Wacky Random</span>
        <span class="count" data-count="wacky"></span>
      </button>
      <button class="card" data-cat="toys">
        <span class="emoji">🧸</span>
        <span class="name">Toys</span>
        <span class="count" data-count="toys"></span>
      </button>
      <button class="card" data-cat="plants">
        <span class="emoji">🌻</span>
        <span class="name">Plants & Food</span>
        <span class="count" data-count="plants"></span>
      </button>
      <button class="card" data-cat="family">
        <span class="emoji">👨‍👩‍👧</span>
        <span class="name">Family</span>
        <span class="count" data-count="family"></span>
      </button>
    </div>
  </section>

  <section id="game" hidden>
    <div class="game-card">
      <span class="cat-label" id="catLabel"></span>
      <div class="clue" id="clue">Press NEXT to get a clue</div>
      <div class="btn-row">
        <button id="nextBtn">Next</button>
        <button id="backBtn">Change Category</button>
      </div>
      <p class="hint">Tip: Enter or Space also triggers Next</p>
    </div>
  </section>

</main>

/* ---------------- UI ---------------- */
const landing = document.getElementById("landing");
const game = document.getElementById("game");
const catLabel = document.getElementById("catLabel");
const clue = document.getElementById("clue");
const nextBtn = document.getElementById("nextBtn");
const backBtn = document.getElementById("backBtn");

let currentCat = null;
let lastClue = null;

// show counts on cards
for (const key of Object.keys(categories)) {
  const el = document.querySelector('[data-count="' + key + '"]');
  if (el) el.textContent = categories[key].length + " options";
}

function pickClue(cat) {
  const pool = categories[cat];
  let item;
  let guard = 0;
  do {
    item = pool[Math.floor(Math.random() * pool.length)];
    guard++;
  } while (item === lastClue && guard < 20);
  lastClue = item;
  return item;
}

function showGame(cat) {
  currentCat = cat;
  lastClue = null;
  catLabel.textContent = catNames[cat];
  clue.textContent = "Press NEXT to get a clue";
  landing.hidden = true;
  game.hidden = false;
}

function showLanding() {
  game.hidden = true;
  landing.hidden = false;
  currentCat = null;
}

document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => showGame(card.dataset.cat));
});

nextBtn.addEventListener("click", () => {
  if (!currentCat) return;
  clue.textContent = pickClue(currentCat);
});

backBtn.addEventListener("click", showLanding);

window.addEventListener("keydown", (e) => {
  if (game.hidden) return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    nextBtn.click();
  }
  if (e.key === "Escape") showLanding();
});
